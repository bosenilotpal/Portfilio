    <header>
      <h1>Contact Me</h1>
    </header>

    <section>
      <h2>Get in Touch</h2>
      <p>
        Feel free to contact me using the form below. I’ll get back to you soon!
      </p>

      <div class="contact-flex">
        <div class="personal-info">
          <h3>Personal Information</h3>
          <p><strong>Telephone:</strong> <a href="tel:+79956620477">+79956620477</a></p>
          <p><strong>Email:</strong> <a href="mailto:nilotpal17@gmail.com">nilotpal17@gmail.com</a></p>
          <p><strong>Location:</strong> Ekaterinburg, Russia</p>
        </div>
        <div class="form-center">
          <form action="#" method="post">
            <label for="name">Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your Name"
              required
            />

            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Your Email"
              required
            />

            <label for="message">Message:</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="Your Message"
            ></textarea>

            <button type="submit">Send Message</button>
          </form>
        </div>
      </div>
    </section>
